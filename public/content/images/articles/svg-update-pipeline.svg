<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="100%" height="100%">
  <defs>
    <linearGradient id="upBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#02040a"/>
      <stop offset="50%" stop-color="#0a121e"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="upBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="upGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="upPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="upGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <pattern id="upGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
    <style>
      @keyframes upBlink { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }
      .blink { animation: upBlink 1.6s ease-in-out infinite; }
      @keyframes upFlow { 0% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: -24; } }
      .flow { stroke-dasharray: 8 8; animation: upFlow 0.8s linear infinite; }
    </style>
  </defs>
  <rect width="1200" height="620" fill="url(#upBg)"/>
  <rect width="1200" height="620" fill="url(#upGrid)"/>

  <g transform="translate(40, 28)">
    <rect width="1120" height="50" rx="10" fill="rgba(15,23,42,0.8)" stroke="rgba(56,189,248,0.3)" stroke-width="1"/>
    <circle cx="25" cy="25" r="6" fill="#a855f7" filter="url(#upGlow)"/>
    <text x="42" y="31" fill="#e2e8f0" font-family="'JetBrains Mono',monospace" font-size="16" font-weight="700" letter-spacing="1">
      UPDATE PIPELINE // 用户改 1 个节点，别让 10 万棵 DOM 陪葬
    </text>
  </g>

  <!-- 流程 5 步 -->
  <g transform="translate(40, 110)">
    <!-- 1 AST -->
    <rect x="0" y="20" width="180" height="120" rx="10" fill="rgba(59,130,246,0.12)" stroke="rgba(59,130,246,0.5)" stroke-width="1.5"/>
    <text x="90" y="52" fill="#60a5fa" font-family="'JetBrains Mono',monospace" font-size="14" text-anchor="middle" font-weight="700">① AST</text>
    <text x="90" y="80" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">XML 解析成</text>
    <text x="90" y="98" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">内存对象树</text>
    <text x="90" y="122" fill="#64748b" font-family="sans-serif" font-size="10" text-anchor="middle">改的是 AST，不是 DOM</text>
    <!-- 2 DIFF -->
    <rect x="235" y="20" width="180" height="120" rx="10" fill="rgba(16,185,129,0.12)" stroke="rgba(16,185,129,0.5)" stroke-width="1.5"/>
    <text x="325" y="52" fill="#34d399" font-family="'JetBrains Mono',monospace" font-size="14" text-anchor="middle" font-weight="700">② DIFF</text>
    <text x="325" y="80" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">对比新旧 AST</text>
    <text x="325" y="98" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">只算出变化路径</text>
    <text x="325" y="122" fill="#64748b" font-family="sans-serif" font-size="10" text-anchor="middle">1000 节点变化 → 命中 3 个</text>
    <!-- 3 PATCH -->
    <rect x="470" y="20" width="180" height="120" rx="10" fill="rgba(245,158,11,0.12)" stroke="rgba(245,158,11,0.5)" stroke-width="1.5"/>
    <text x="560" y="52" fill="#fbbf24" font-family="'JetBrains Mono',monospace" font-size="14" text-anchor="middle" font-weight="700">③ PATCH</text>
    <text x="560" y="80" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">只更新变化的节点</text>
    <text x="560" y="98" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">setAttribute 精确打击</text>
    <text x="560" y="122" fill="#64748b" font-family="sans-serif" font-size="10" text-anchor="middle">不整棵树重渲染</text>
    <!-- 4 rAF -->
    <rect x="705" y="20" width="180" height="120" rx="10" fill="rgba(168,85,247,0.12)" stroke="rgba(168,85,247,0.5)" stroke-width="1.5"/>
    <text x="795" y="52" fill="#c084fc" font-family="'JetBrains Mono',monospace" font-size="14" text-anchor="middle" font-weight="700">④ rAF</text>
    <text x="795" y="80" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">requestAnimationFrame</text>
    <text x="795" y="98" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">一帧内批量合并</text>
    <text x="795" y="122" fill="#64748b" font-family="sans-serif" font-size="10" text-anchor="middle">拖动 60 次/秒 → 合并成 1 次</text>
    <!-- 5 GPU -->
    <rect x="940" y="20" width="180" height="120" rx="10" fill="rgba(6,182,212,0.12)" stroke="rgba(6,182,212,0.5)" stroke-width="1.5"/>
    <text x="1030" y="52" fill="#22d3ee" font-family="'JetBrains Mono',monospace" font-size="14" text-anchor="middle" font-weight="700">⑤ GPU</text>
    <text x="1030" y="80" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">CSS transform 合成</text>
    <text x="1030" y="98" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">平移缩放不重绘</text>
    <text x="1030" y="122" fill="#64748b" font-family="sans-serif" font-size="10" text-anchor="middle">Skia / WebRender / CoreAnimation</text>
    <!-- 箭头 -->
    <line x1="180" y1="80" x2="231" y2="80" stroke="url(#upGreen)" stroke-width="3" class="flow"/>
    <line x1="415" y1="80" x2="466" y2="80" stroke="url(#upBlue)" stroke-width="3" class="flow"/>
    <line x1="650" y1="80" x2="701" y2="80" stroke="url(#upPurple)" stroke-width="3" class="flow"/>
    <line x1="885" y1="80" x2="936" y2="80" stroke="url(#upBlue)" stroke-width="3" class="flow"/>
  </g>

  <!-- 下排：naive vs 优化对比 -->
  <g transform="translate(60, 290)">
    <rect width="520" height="150" rx="12" fill="rgba(15,23,42,0.85)" stroke="rgba(239,68,68,0.4)" stroke-width="1.5"/>
    <text x="260" y="30" fill="#fca5a5" font-family="'JetBrains Mono',monospace" font-size="14" text-anchor="middle" font-weight="700">❌ NAIVE · 天真方案</text>
    <text x="260" y="60" fill="#94a3b8" font-family="sans-serif" font-size="12" text-anchor="middle">改 1 个节点 → 同步 setAttribute → 立即触发</text>
    <text x="260" y="82" fill="#94a3b8" font-family="sans-serif" font-size="12" text-anchor="middle">整棵 SVG 树 style + layout + paint</text>
    <text x="260" y="110" fill="#fca5a5" font-family="'JetBrains Mono',monospace" font-size="13" text-anchor="middle" class="blink">10 万节点 → 每帧都爆 Long Task</text>
  </g>
  <g transform="translate(620, 290)">
    <rect width="520" height="150" rx="12" fill="rgba(15,23,42,0.85)" stroke="rgba(16,185,129,0.5)" stroke-width="1.5"/>
    <text x="260" y="30" fill="#6ee7b7" font-family="'JetBrains Mono',monospace" font-size="14" text-anchor="middle" font-weight="700">✅ PIPELINE · 更新管线</text>
    <text x="260" y="60" fill="#94a3b8" font-family="sans-serif" font-size="12" text-anchor="middle">改 1 个节点 → AST diff → 只 patch 那 1 个</text>
    <text x="260" y="82" fill="#94a3b8" font-family="sans-serif" font-size="12" text-anchor="middle">→ rAF 批量 → 平移缩放走 CSS transform</text>
    <text x="260" y="110" fill="#6ee7b7" font-family="'JetBrains Mono',monospace" font-size="13" text-anchor="middle" class="blink">10 万节点 → 单次操作 &lt; 1ms</text>
  </g>

  <!-- 底部总结条 -->
  <g transform="translate(60, 470)">
    <rect width="1080" height="120" rx="12" fill="rgba(15,23,42,0.6)" stroke="rgba(148,163,184,0.2)" stroke-width="1"/>
    <text x="30" y="34" fill="#e2e8f0" font-family="sans-serif" font-size="13" font-weight="600">三条铁律（来源：MDN Optimizing canvas / web.dev）</text>
    <text x="30" y="64" fill="#94a3b8" font-family="sans-serif" font-size="12">1. 只渲染差异，不渲染整个新状态——MDN 原话 "Render screen differences only, not the whole new state"。</text>
    <text x="30" y="88" fill="#94a3b8" font-family="sans-serif" font-size="12">2. 用 requestAnimationFrame 批量提交，别用 setInterval 赶场；一次交互合并成一帧。</text>
    <text x="30" y="112" fill="#94a3b8" font-family="sans-serif" font-size="12">3. 平移/缩放用 CSS transform——它走 GPU，不触发 layout/paint（"CSS transforms are faster since they use the GPU"）。</text>
  </g>
</svg>
