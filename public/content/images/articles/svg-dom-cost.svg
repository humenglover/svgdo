<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="100%" height="100%">
  <defs>
    <linearGradient id="dcBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#02040a"/>
      <stop offset="50%" stop-color="#0a121e"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="dcGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="dcOrange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="dcRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <filter id="dcGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <pattern id="dcGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
    <style>
      @keyframes dcBlink { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }
      .blink { animation: dcBlink 1.6s ease-in-out infinite; }
      @keyframes dcFlow { 0% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: -24; } }
      .flow { stroke-dasharray: 6 6; animation: dcFlow 1s linear infinite; }
    </style>
  </defs>
  <rect width="1200" height="620" fill="url(#dcBg)"/>
  <rect width="1200" height="620" fill="url(#dcGrid)"/>

  <g transform="translate(40, 28)">
    <rect width="1120" height="50" rx="10" fill="rgba(15,23,42,0.8)" stroke="rgba(56,189,248,0.3)" stroke-width="1"/>
    <circle cx="25" cy="25" r="6" fill="#ef4444" filter="url(#dcGlow)"/>
    <text x="42" y="31" fill="#e2e8f0" font-family="'JetBrains Mono',monospace" font-size="16" font-weight="700" letter-spacing="1">
      SVG NODE COST // 一个 SVG 节点 = 一个 DOM 节点，都是要钱的
    </text>
  </g>

  <!-- 左侧：节点规模对比 -->
  <g transform="translate(60, 115)">
    <rect width="640" height="330" rx="12" fill="rgba(15,23,42,0.85)" stroke="rgba(148,163,184,0.35)" stroke-width="1.5"/>
    <text x="320" y="28" fill="#94a3b8" font-family="sans-serif" font-size="13" text-anchor="middle" font-weight="600">节点规模 → 浏览器账单</text>

    <g transform="translate(30, 52)">
      <text x="0" y="16" fill="#94a3b8" font-family="sans-serif" font-size="12">一个 24×24 图标</text>
      <rect x="200" y="0" width="60" height="24" rx="4" fill="rgba(16,185,129,0.25)" stroke="#10b981" stroke-width="1.5"/>
      <text x="230" y="16" fill="#6ee7b7" font-family="'JetBrains Mono',monospace" font-size="12" text-anchor="middle">1 节点</text>
      <text x="290" y="16" fill="#64748b" font-family="sans-serif" font-size="12">≈ 免费</text>

      <text x="0" y="60" fill="#94a3b8" font-family="sans-serif" font-size="12">普通网页的全部 DOM</text>
      <rect x="200" y="44" width="140" height="24" rx="4" fill="rgba(245,158,11,0.3)" stroke="#f59e0b" stroke-width="1.5"/>
      <text x="270" y="60" fill="#fcd34d" font-family="'JetBrains Mono',monospace" font-size="12" text-anchor="middle">~800 节点</text>
      <text x="360" y="60" fill="#f59e0b" font-family="sans-serif" font-size="12">Lighthouse 警告线</text>

      <text x="0" y="104" fill="#94a3b8" font-family="sans-serif" font-size="12">一张美国县级地图</text>
      <rect x="200" y="88" width="260" height="24" rx="4" fill="rgba(239,68,68,0.3)" stroke="#ef4444" stroke-width="1.5"/>
      <text x="330" y="104" fill="#fca5a5" font-family="'JetBrains Mono',monospace" font-size="12" text-anchor="middle">3,143 节点（真实案例）</text>

      <text x="0" y="148" fill="#94a3b8" font-family="sans-serif" font-size="12">复杂的插画 / 地图</text>
      <rect x="200" y="132" width="380" height="24" rx="4" fill="rgba(239,68,68,0.45)" stroke="#ef4444" stroke-width="1.5" class="blink"/>
      <text x="390" y="148" fill="#fca5a5" font-family="'JetBrains Mono',monospace" font-size="12" text-anchor="middle">10,000+ 节点 · Lighthouse 报错线</text>

      <text x="0" y="196" fill="#94a3b8" font-family="sans-serif" font-size="12">工业级工程文件</text>
      <rect x="200" y="180" width="380" height="24" rx="4" fill="rgba(168,85,247,0.35)" stroke="#a855f7" stroke-width="1.5"/>
      <text x="390" y="196" fill="#d8b4fe" font-family="'JetBrains Mono',monospace" font-size="12" text-anchor="middle">100,000+ 节点 · 编辑器杀手</text>

      <line x1="0" y1="228" x2="580" y2="228" stroke="rgba(148,163,184,0.2)" stroke-width="1"/>
      <text x="0" y="254" fill="#e2e8f0" font-family="sans-serif" font-size="12">SVG 节点不是"画"，是 DOM 元素：</text>
      <text x="0" y="278" fill="#94a3b8" font-family="sans-serif" font-size="12">每个节点都要参与 style 计算、layout 布局、paint 绘制，</text>
      <text x="0" y="300" fill="#94a3b8" font-family="sans-serif" font-size="12">节点越多，一次交互触发的重算就越贵。</text>
    </g>
  </g>

  <!-- 右侧：为什么节点多就卡 -->
  <g transform="translate(740, 115)">
    <rect width="400" height="330" rx="12" fill="rgba(15,23,42,0.85)" stroke="rgba(148,163,184,0.35)" stroke-width="1.5"/>
    <text x="200" y="28" fill="#94a3b8" font-family="sans-serif" font-size="13" text-anchor="middle" font-weight="600">改一个属性，浏览器要重算什么</text>
    <g transform="translate(26, 56)">
      <rect x="0" y="0" width="348" height="58" rx="8" fill="rgba(59,130,246,0.12)" stroke="rgba(59,130,246,0.4)" stroke-width="1"/>
      <text x="14" y="24" fill="#93c5fd" font-family="'JetBrains Mono',monospace" font-size="13">STYLE  · 样式重算</text>
      <text x="14" y="46" fill="#94a3b8" font-family="sans-serif" font-size="11">遍历匹配 CSS 选择器 → O(节点 × 选择器)</text>
      <rect x="0" y="68" width="348" height="58" rx="8" fill="rgba(16,185,129,0.12)" stroke="rgba(16,185,129,0.4)" stroke-width="1"/>
      <text x="14" y="92" fill="#6ee7b7" font-family="'JetBrains Mono',monospace" font-size="13">LAYOUT · 布局</text>
      <text x="14" y="114" fill="#94a3b8" font-family="sans-serif" font-size="11">几何变化波及父/子节点 → 树越大越贵</text>
      <rect x="0" y="136" width="348" height="58" rx="8" fill="rgba(168,85,247,0.12)" stroke="rgba(168,85,247,0.4)" stroke-width="1"/>
      <text x="14" y="160" fill="#d8b4fe" font-family="'JetBrains Mono',monospace" font-size="13">PAINT · 绘制</text>
      <text x="14" y="182" fill="#94a3b8" font-family="sans-serif" font-size="11">路径光栅化 + 抗锯齿 → 复杂 path 更贵</text>
      <line x1="0" y1="212" x2="348" y2="212" stroke="rgba(148,163,184,0.2)" stroke-width="1"/>
      <text x="0" y="240" fill="#fca5a5" font-family="'JetBrains Mono',monospace" font-size="13" class="blink">改动一个节点 = 重算一片森林</text>
    </g>
  </g>

  <!-- 底部总结条 -->
  <g transform="translate(60, 470)">
    <rect width="1080" height="120" rx="12" fill="rgba(15,23,42,0.6)" stroke="rgba(148,163,184,0.2)" stroke-width="1"/>
    <text x="30" y="34" fill="#e2e8f0" font-family="sans-serif" font-size="13" font-weight="600">结论：SVG 性能问题本质是 DOM 规模问题</text>
    <text x="30" y="64" fill="#94a3b8" font-family="sans-serif" font-size="12">1. 1 万个节点以内，现代浏览器随便画；超过 1 万，每次交互都开始肉疼。</text>
    <text x="30" y="88" fill="#94a3b8" font-family="sans-serif" font-size="12">2. 编辑器的噩梦不在"画出来"，在"改起来"——每次拖拽、每次改属性都要触发整棵树的代价。</text>
    <text x="30" y="112" fill="#94a3b8" font-family="sans-serif" font-size="12">3. 所以后面两章：只画看得见的（视口裁剪），只更新变了的（diff + 批量）。</text>
  </g>
</svg>
